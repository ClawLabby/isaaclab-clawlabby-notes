# Proposed replacement for the deploy-docs job in .github/workflows/docs.yaml
#
# This replaces the peaceiris/actions-gh-pages branch-push deployment with
# GitHub's native Actions-based Pages deployment (artifact upload, no branch).
#
# WHAT CHANGES:
#   - deploy mechanism: branch push → artifact upload (no gh-pages branch needed)
#   - adds permissions block (pages: write, id-token: write)
#   - adds environment block (links to github-pages environment in repo UI)
#   - two new actions: upload-pages-artifact + deploy-pages (replace peaceiris)
#
# WHAT STAYS THE SAME:
#   - check-secrets and build-docs jobs: untouched
#   - multi-version doc structure: all version subdirs (main/, v2.3.2/, etc.) preserved
#   - trigger conditions: main, devel, release/* branches
#   - URLs: isaac-sim.github.io/IsaacLab/{version}/ — no change
#
# PREREQUISITES (one-time, before merging this change):
#   1. Repo Settings → Pages → Source → select "GitHub Actions" (not "Deploy from a branch")
#   2. After verifying the new deployment works, delete the gh-pages branch
#
# The check-secrets and build-docs jobs remain exactly as they are.
# Only this deploy-docs job is replaced.

  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: [check-secrets, build-docs]
    if: needs.check-secrets.outputs.trigger-deploy == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download docs artifact
      uses: actions/download-artifact@v4
      with:
        name: docs-html
        path: ./docs/_build

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs/_build

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
